name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (ubuntu-latest)
            os: ubuntu-latest
            bin: ease
            race_flag: -race
            vscode_flag: -vscode
          - name: Windows (windows-latest)
            os: windows-latest
            bin: ease.exe
            race_flag: ""
            vscode_flag: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Ebitengine system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev \
            libgl1-mesa-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            libasound2-dev \
            pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js (for WASM parity & JS checks)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine dev build version
        id: ver
        shell: bash
        run: echo "version=dev-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Run unified CI pipeline
        run: go run ./tools/ci ${{ matrix.race_flag }} ${{ matrix.vscode_flag }} -version "${{ steps.ver.outputs.version }}" -out "${{ matrix.bin }}"

      - name: Upload built ease binary
        uses: actions/upload-artifact@v4
        with:
          name: ease-${{ runner.os }}
          path: ${{ matrix.bin }}
          if-no-files-found: error

      - name: Upload VS Code extension artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ease-vscode-vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error
