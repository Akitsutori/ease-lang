name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-amd64
            race_flag: -race
            vscode_flag: -vscode
          - os: windows-latest
            asset_suffix: windows-amd64.exe
            race_flag: ""
            vscode_flag: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Ebitengine system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev \
            libgl1-mesa-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            libasound2-dev \
            pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js (for WASM parity & JS checks)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine release version & artifact name
        id: ver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset_name=ease-${VERSION}-${{ matrix.asset_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Run unified CI & release build pipeline
        run: go run ./tools/ci ${{ matrix.race_flag }} ${{ matrix.vscode_flag }} -version "${{ steps.ver.outputs.version }}" -out "${{ steps.ver.outputs.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.asset_name }}
          path: ${{ steps.ver.outputs.asset_name }}
          if-no-files-found: error

      - name: Upload VS Code extension artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ease-vscode-vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
