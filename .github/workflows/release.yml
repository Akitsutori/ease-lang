name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: ease-linux-amd64
          - os: windows-latest
            asset_name: ease-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Ebitengine system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev \
            libgl1-mesa-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            libasound2-dev \
            pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine release version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: go build -ldflags "-s -w -X ease-lang/internal/ease.Version=${{ steps.ver.outputs.version }}" -o ${{ matrix.asset_name }} ./cmd/ease

      - name: Verify embedded version
        shell: bash
        run: ./${{ matrix.asset_name }} version

      - name: Package VS Code extension (.vsix)
        if: runner.os == 'Linux'
        env:
          EASE_VERSION: ${{ steps.ver.outputs.version }}
        run: go run ./editors/vscode

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      - name: Upload VS Code extension artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ease-vscode-vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
