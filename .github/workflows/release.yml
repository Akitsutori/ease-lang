name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-amd64
            race_flag: -race
          - os: windows-latest
            asset_suffix: windows-amd64.exe
            race_flag: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Ebitengine system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev \
            libgl1-mesa-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            libasound2-dev \
            pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine release version & artifact name
        id: ver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset_name=ease-${VERSION}-${{ matrix.asset_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Static analysis (go vet)
        run: go vet ./...

      - name: Run Go unit tests
        run: go test ${{ matrix.race_flag }} ./...

      - name: Build binary
        run: go build -ldflags "-s -w -X ease-lang/internal/ease.Version=${{ steps.ver.outputs.version }}" -o ${{ steps.ver.outputs.asset_name }} ./cmd/ease

      - name: Verify embedded version
        shell: bash
        run: ./${{ steps.ver.outputs.asset_name }} version

      - name: Run Ease language feature tests
        shell: bash
        run: |
          for f in tests/*.ease; do
            echo "==> ease test $f"
            ./${{ steps.ver.outputs.asset_name }} test "$f"
          done

      - name: Verify offline Ease examples
        shell: bash
        run: |
          for f in \
            examples/00_hello_world.ease \
            examples/01_entry_check.ease \
            examples/02_guard.ease \
            examples/03_player.ease \
            examples/04_particles.ease \
            examples/05_network.ease \
            examples/06_window.ease \
            examples/fibonacci.ease \
            examples/showcase.ease \
            examples/syntax_spec.ease; do
            echo "==> ease test $f"
            ./${{ steps.ver.outputs.asset_name }} test "$f"
          done

      - name: Package VS Code extension (.vsix)
        if: runner.os == 'Linux'
        env:
          EASE_VERSION: ${{ steps.ver.outputs.version }}
        run: go run ./editors/vscode

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.asset_name }}
          path: ${{ steps.ver.outputs.asset_name }}

      - name: Upload VS Code extension artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ease-vscode-vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
