<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Abgerundeter dunkelblauer Hintergrund -->
  <rect width="128" height="128" rx="28" fill="#0A192F" />

  <!-- Drei-Strich-"E" (zentriert, ohne umschließende Klammern/Rahmen) -->
  <!-- Oberer langer Balken (Hellblau) -->
  <rect x="28" y="30" width="72" height="16" rx="8" fill="#38BDF8" />

  <!-- Mittlerer kurzer Balken (Grün) -->
  <rect x="28" y="56" width="50" height="16" rx="8" fill="#34D399" />

  <!-- Unterer langer Balken (Hellblau) -->
  <rect x="28" y="82" width="72" height="16" rx="8" fill="#38BDF8" />
</svg>
